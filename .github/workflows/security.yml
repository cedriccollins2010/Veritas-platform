name: Security

# Analyses de sécurité, en complément de la CI :
# - gitleaks : secrets (mots de passe, clés, jetons) dans tout l'historique Git ;
# - Semgrep : failles connues dans le code Python, TypeScript, Dockerfiles et workflows.
# Les règles Bandit sont déjà appliquées par ruff (sélection « S » dans backend/pyproject.toml).
#
# Les actions sont référencées par l'empreinte de leur commit, pas par une étiquette (@v7) :
# une étiquette peut être déplacée vers du code malveillant, une empreinte non.
# Dependabot met ces empreintes à jour.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Chaque lundi à 11 h UTC : de nouvelles règles peuvent révéler une faille dans du code inchangé.
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # Empreinte publiée par le projet gitleaks pour cette version (gitleaks_8.30.1_checksums.txt).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit
      - name: Installer gitleaks (binaire officiel, empreinte vérifiée)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Rechercher des secrets dans l'historique
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: >-
          semgrep scan
          --config p/python
          --config p/typescript
          --config p/react
          --config p/nextjs
          --config p/dockerfile
          --config p/github-actions
          --metrics=off
          --error
