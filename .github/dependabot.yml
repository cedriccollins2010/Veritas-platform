# Dependabot ouvre une pull request quand une dépendance a une nouvelle version
# ou une faille connue. Les mises à jour mineures sont groupées pour limiter le bruit ;
# les mises à jour de sécurité arrivent toujours seules, sans attendre le lundi.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(ci)"

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
    labels: [dependencies, infrastructure]
    commit-message:
      prefix: "deps(docker)"
