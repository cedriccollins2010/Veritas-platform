[project]
name = "veritas-backend"
version = "0.1.0"
description = "VERITAS — API de constitution et de vérification de dossiers de preuve numérique"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: test qui nécessite une base PostgreSQL accessible (ignoré sinon)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert est normal dans les tests

[tool.ruff.lint.per-file-ignores]
# Les tests utilisent des mots de passe factices écrits en clair : c'est voulu.
"tests/*" = ["S105", "S106"]
